# Development Environment Configuration
# Overrides default.yaml settings for development

system:
  environment: development

logging:
  level: DEBUG
  console:
    enabled: true
    level: DEBUG
  file:
    enabled: true
    level: DEBUG
    rotation: size
    max_size_mb: 5
    backup_count: 3

controller:
  ryu:
    log_level: DEBUG
  connection:
    timeout: 30
    retry_attempts: 5

classification:
  classification_interval: 5  # More frequent updates in dev
  confidence_threshold: 0.6   # Lower threshold for testing

flow_rules:
  auto_install: false  # Manual control in development
  max_rules: 500

metrics:
  export:
    enabled: true
    interval: 5
  prometheus:
    enabled: false  # Disable in dev unless needed

dashboard:
  host: "localhost"
  port: 9000
  debug: true
  features:
    websocket: true
    real_time_updates: true

performance:
  batch_processing:
    enabled: false  # Process individually for debugging
  rate_limiting:
    enabled: false  # No limits in dev

paths:
  logs: "logs/dev"
  metrics: "metrics/dev"
  flow_rules: "flow_rules/dev"
