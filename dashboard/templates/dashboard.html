<!DOCTYPE html>
<html>
<head>
    <title>SDN Traffic Intelligence</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; }
        .card { background: #1e293b; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        h1 { color: #60a5fa; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .stat-value { font-size: 2.5rem; font-weight: bold; color: #38bdf8; }
        .stat-label { color: #94a3b8; text-transform: uppercase; font-size: 0.8rem; }
    </style>
</head>
<body>
    <h1>🚀 SDN Traffic Intelligence Dashboard</h1>
    
    <div class="grid">
        <div class="card">
            <div class="stat-label">Active Flows</div>
            <div id="flow-count" class="stat-value">0</div>
        </div>
        <div class="card">
            <div class="stat-label">System State</div>
            <div class="stat-value" style="color: #10b981;">SECURE</div>
        </div>
    </div>

    <div class="card" style="margin-top: 20px;">
        <h3>Traffic Analysis (Real-time)</h3>
        <canvas id="trafficChart" height="100"></canvas>
    </div>

    <script>
        // Placeholder for real-time chart updates
        const ctx = document.getElementById('trafficChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['10s', '8s', '6s', '4s', '2s', 'Now'],
                datasets: [{
                    label: 'Network Throughput (Mbps)',
                    data: [12, 19, 3, 5, 2, 3],
                    borderColor: '#60a5fa',
                    tension: 0.4
                }]
            }
        });
    </script>
</body>
</html>
