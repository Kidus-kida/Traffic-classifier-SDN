version: '3.8'

services:
  # SDN Controller with AI Traffic Classifier
  controller:
    build:
      context: ..
      dockerfile: docker/Dockerfile.controller
    container_name: sdn-classifier
    hostname: controller
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - RYU_PORT=6633
      - DASHBOARD_PORT=9000
    ports:
      - "6633:6633" # OpenFlow
      - "9000:9000" # Dashboard
    volumes:
      - ../logs:/app/logs
      - ../metrics:/app/metrics
      - ../flow_rules:/app/flow_rules
      - ../config:/app/config:ro
      - ../models:/app/models:ro
    networks:
      - sdn-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Web Dashboard (if separate from controller)
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    container_name: sdn-dashboard
    hostname: dashboard
    environment:
      - CONTROLLER_HOST=controller
      - CONTROLLER_PORT=6633
    ports:
      - "8080:8080"
    depends_on:
      - controller
    networks:
      - sdn-network
    restart: unless-stopped

  # Prometheus for metrics (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: sdn-prometheus
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - sdn-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: sdn-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - sdn-network
    restart: unless-stopped
    profiles:
      - monitoring

networks:
  sdn-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  prometheus-data:
  grafana-data:
