# Traffic Classifier SDN - Default Configuration

# ============================================================================
# SYSTEM CONFIGURATION
# ============================================================================

system:
  name: "Traffic Classifier SDN"
  version: "2.0.0"
  environment: "development"  # development, production, testing
  
# ============================================================================
# SDN CONTROLLER CONFIGURATION
# ============================================================================

controller:
  # Ryu Controller Settings
  ryu:
    executable: "ryu-manager"  # Will be resolved via PATH
    listen_port: 6633
    monitor_script: "simple_monitor_13.py"
    log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
    
  # OpenFlow Settings
  openflow:
    version: "1.3"
    idle_timeout: 300  # seconds
    hard_timeout: 600  # seconds
    
  # Connection Settings
  connection:
    retry_attempts: 5
    retry_delay: 2  # seconds
    timeout: 30  # seconds
    health_check_interval: 10  # seconds

# ============================================================================
# TRAFFIC CLASSIFICATION CONFIGURATION
# ============================================================================

classification:
  # Supported Traffic Types
  traffic_types:
    - dns
    - game
    - ping
    - telnet
    - voice
    - http
    - https
    - ftp
    - ssh
    - video
    
  # Feature Extraction
  features:
    count: 16  # Number of features extracted per flow
    update_interval: 1  # seconds
    
  # Classification Settings
  confidence_threshold: 0.7  # Minimum confidence for auto-rule installation
  classification_interval: 10  # seconds between classifications
  flow_history_size: 100  # Number of recent predictions to keep
  
  # Model Settings
  models:
    directory: "models"
    default_algorithm: "Randomforest"
    available_algorithms:
      - logistic
      - kneighbors
      - Randomforest
      - svm
      - gaussiannb
      - kmeans
    
    # Model file mapping
    files:
      logistic: "LogisticRegression"
      kmeans: "KMeans_Clustering"
      svm: "SVC"
      kneighbors: "KNeighbors"
      Randomforest: "RandomForestClassifier"
      gaussiannb: "GaussianNB"
    
  # Fallback Configuration (when ML fails)
  fallback:
    enabled: true
    method: "rule_based"  # rule_based, last_known, default
    default_class: "BEST_EFFORT"

# ============================================================================
# QOS (QUALITY OF SERVICE) CONFIGURATION
# ============================================================================

qos:
  # QoS Class Mapping
  classes:
    voice:
      class: "REAL_TIME"
      priority: 5
      action: "PRIORITY_QUEUE_1"
      description: "VoIP traffic requiring low latency"
      
    video:
      class: "REAL_TIME"
      priority: 4
      action: "PRIORITY_QUEUE_2"
      description: "Video streaming traffic"
      
    game:
      class: "INTERACTIVE"
      priority: 3
      action: "PRIORITY_QUEUE_3"
      description: "Online gaming traffic"
      
    dns:
      class: "NETWORK_CONTROL"
      priority: 4
      action: "FAST_PATH"
      description: "DNS queries"
      
    ssh:
      class: "INTERACTIVE"
      priority: 3
      action: "PRIORITY_QUEUE_3"
      description: "SSH remote access"
      
    telnet:
      class: "INTERACTIVE"
      priority: 3
      action: "PRIORITY_QUEUE_3"
      description: "Telnet remote access"
      
    http:
      class: "BEST_EFFORT"
      priority: 2
      action: "NORMAL_QUEUE"
      description: "HTTP web traffic"
      
    https:
      class: "BEST_EFFORT"
      priority: 2
      action: "NORMAL_QUEUE"
      description: "HTTPS secure web traffic"
      
    ftp:
      class: "BULK"
      priority: 1
      action: "BULK_QUEUE"
      description: "FTP file transfer"
      
    ping:
      class: "NETWORK_CONTROL"
      priority: 4
      action: "FAST_PATH"
      description: "ICMP ping traffic"
      
  # Default QoS for unknown traffic
  default:
    class: "BEST_EFFORT"
    priority: 0
    action: "NORMAL_QUEUE"

# ============================================================================
# FLOW RULE MANAGEMENT
# ============================================================================

flow_rules:
  auto_install: false  # Enable automatic flow rule installation
  rules_directory: "flow_rules"
  rules_file: "auto_generated_rules.json"
  max_rules: 1000  # Maximum number of rules to store
  rule_timeout: 300  # seconds
  
# ============================================================================
# DATA COLLECTION & TRAINING
# ============================================================================

training:
  # Data Collection
  data_directory: "datasets"
  collection_timeout: 900  # 15 minutes (900 seconds)
  min_samples_per_class: 100
  
  # Training Settings
  test_split: 0.2  # 20% for testing
  random_state: 42
  cross_validation_folds: 5
  
  # Feature Engineering
  feature_scaling: true
  handle_missing_values: true
  outlier_detection: true

# ============================================================================
# METRICS & MONITORING
# ============================================================================

metrics:
  enabled: true
  export_directory: "metrics"
  export_file: "real_time_metrics.json"
  export_interval: 5  # seconds
  
  # Prometheus Integration
  prometheus:
    enabled: false
    port: 9090
    endpoint: "/metrics"
    
  # Metrics to Track
  track:
    - total_flows
    - active_flows
    - classification_accuracy
    - processing_latency
    - throughput
    - qos_distribution
    - model_confidence

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================

logging:
  # Log Levels: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"
  
  # Log Formats
  format: "json"  # json, text
  
  # Log Destinations
  console:
    enabled: true
    level: "INFO"
    
  file:
    enabled: true
    level: "DEBUG"
    directory: "logs"
    filename: "classifier.log"
    max_size_mb: 10
    backup_count: 5
    rotation: "time"  # time, size
    
  # Structured Logging Fields
  include_fields:
    - timestamp
    - level
    - module
    - function
    - message
    - flow_id
    - traffic_type
    - confidence

# ============================================================================
# DASHBOARD CONFIGURATION
# ============================================================================

dashboard:
  enabled: true
  host: "0.0.0.0"
  port: 9000
  debug: false
  
  # WebSocket Settings
  websocket:
    enabled: true
    update_interval: 2  # seconds
    
  # Dashboard Features
  features:
    real_time_classification: true
    flow_statistics: true
    qos_distribution: true
    performance_metrics: true
    historical_data: true

# ============================================================================
# PERFORMANCE & RELIABILITY
# ============================================================================

performance:
  # Processing Limits
  max_concurrent_flows: 10000
  max_processing_time_ms: 100  # Maximum time for classification
  batch_size: 100  # Flows to process in batch
  
  # Circuit Breaker
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    timeout: 60  # seconds
    half_open_timeout: 30  # seconds
    
  # Rate Limiting
  rate_limiting:
    enabled: false
    max_requests_per_second: 1000

# ============================================================================
# SECURITY CONFIGURATION
# ============================================================================

security:
  # Model Validation
  validate_models: true
  allowed_model_formats: ["pickle", "joblib"]
  
  # API Security (if enabled)
  api:
    enabled: false
    authentication: false
    api_key_required: false
    
  # Data Privacy
  anonymize_mac_addresses: false
  log_sensitive_data: false

# ============================================================================
# TESTING & DEVELOPMENT
# ============================================================================

testing:
  # Test Data Generation
  generate_synthetic_traffic: false
  synthetic_traffic_rate: 100  # packets per second
  
  # Benchmark Settings
  benchmark:
    enabled: false
    iterations: 100
    warmup_iterations: 10
    
# ============================================================================
# PATHS & DIRECTORIES
# ============================================================================

paths:
  # Base Directories
  base_dir: "."
  src_dir: "src"
  config_dir: "config"
  data_dir: "data"
  
  # Specific Directories
  models: "models"
  datasets: "datasets"
  logs: "logs"
  metrics: "metrics"
  flow_rules: "flow_rules"
  scripts: "scripts"
  
  # Ensure these directories exist
  create_if_missing:
    - logs
    - metrics
    - flow_rules
    - datasets
