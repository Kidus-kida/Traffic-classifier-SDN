<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Traffic Classifier Dashboard</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        
        h1 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 5px;
        }
        
        .subtitle {
            color: #666;
            font-size: 0.9em;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }
        
        .chart-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        
        .chart-title {
            font-size: 1.3em;
            margin-bottom: 20px;
            color: #667eea;
        }
        
        .flows-table {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        
        tr:hover {
            background: #f5f5f5;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .badge-realtime {
            background: #ff6b6b;
            color: white;
        }
        
        .badge-interactive {
            background: #4ecdc4;
            color: white;
        }
        
        .badge-besteffort {
            background: #95e1d3;
            color: #333;
        }
        
        .badge-bulk {
            background: #f38181;
            color: white;
        }
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .status-healthy {
            background: #51cf66;
        }
        
        .status-degraded {
            background: #ffd43b;
        }
        
        .status-unhealthy {
            background: #ff6b6b;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .live-indicator {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 AI Traffic Classifier Dashboard</h1>
            <p class="subtitle">Real-time SDN Traffic Classification & QoS Management</p>
        </header>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Classifications</div>
                <div class="stat-value" id="total-classifications">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active Flows</div>
                <div class="stat-value" id="active-flows">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">System Status</div>
                <div class="stat-value" id="system-status">
                    <span class="status-indicator status-healthy live-indicator"></span>
                    <span style="font-size: 0.6em;">Healthy</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Uptime</div>
                <div class="stat-value" id="uptime" style="font-size: 1.8em;">0m</div>
            </div>
        </div>
        
        <div class="chart-container">
            <h2 class="chart-title">📊 Traffic Distribution</h2>
            <canvas id="trafficChart" height="80"></canvas>
        </div>
        
        <div class="flows-table">
            <h2 class="chart-title">📡 Recent Classifications</h2>
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Flow ID</th>
                        <th>Traffic Type</th>
                        <th>Confidence</th>
                        <th>QoS Class</th>
                        <th>Priority</th>
                    </tr>
                </thead>
                <tbody id="flows-tbody">
                    <tr>
                        <td colspan="6" style="text-align: center; color: #999;">
                            Waiting for classifications...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        // Initialize Socket.IO
        const socket = io();
        
        // Chart setup
        const ctx = document.getElementById('trafficChart').getContext('2d');
        const trafficChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: [],
                datasets: [{
                    data: [],
                    backgroundColor: [
                        '#667eea', '#764ba2', '#f093fb', '#4facfe',
                        '#43e97b', '#fa709a', '#fee140', '#30cfd0',
                        '#a8edea', '#fed6e3'
                    ]
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'right'
                    }
                }
            }
        });
        
        // QoS class mapping
        const qosClassMap = {
            'REAL_TIME': 'realtime',
            'INTERACTIVE': 'interactive',
            'BEST_EFFORT': 'besteffort',
            'BULK': 'bulk'
        };
        
        // Update stats
        function updateStats() {
            fetch('/api/stats')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('total-classifications').textContent = 
                        data.total.toLocaleString();
                    
                    // Update chart
                    const types = Object.keys(data.by_type);
                    const counts = Object.values(data.by_type);
                    
                    trafficChart.data.labels = types;
                    trafficChart.data.datasets[0].data = counts;
                    trafficChart.update();
                });
            
            fetch('/api/flows')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('active-flows').textContent = 
                        data.count.toLocaleString();
                });
        }
        
        // Socket.IO event handlers
        socket.on('connect', () => {
            console.log('Connected to server');
        });
        
        socket.on('classification_update', (data) => {
            addClassificationRow(data);
            updateStats();
        });
        
        socket.on('health_update', (data) => {
            updateSystemHealth(data);
        });
        
        function addClassificationRow(data) {
            const tbody = document.getElementById('flows-tbody');
            
            // Remove placeholder if exists
            if (tbody.children.length === 1 && 
                tbody.children[0].children[0].colSpan === 6) {
                tbody.innerHTML = '';
            }
            
            const row = tbody.insertRow(0);
            const time = new Date().toLocaleTimeString();
            
            const qosClass = data.qos_class || 'BEST_EFFORT';
            const badgeClass = `badge badge-${qosClassMap[qosClass] || 'besteffort'}`;
            
            row.innerHTML = `
                <td>${time}</td>
                <td>${data.flow_id || 'N/A'}</td>
                <td><strong>${data.traffic_type || 'unknown'}</strong></td>
                <td>${((data.confidence || 0) * 100).toFixed(1)}%</td>
                <td><span class="${badgeClass}">${qosClass}</span></td>
                <td>${data.priority || 0}</td>
            `;
            
            // Keep only last 20 rows
            while (tbody.children.length > 20) {
                tbody.removeChild(tbody.lastChild);
            }
        }
        
        function updateSystemHealth(data) {
            const statusEl = document.getElementById('system-status');
            const status = data.status || 'unknown';
            
            let statusClass = 'status-healthy';
            if (status === 'degraded') statusClass = 'status-degraded';
            if (status === 'unhealthy') statusClass = 'status-unhealthy';
            
            statusEl.innerHTML = `
                <span class="status-indicator ${statusClass} live-indicator"></span>
                <span style="font-size: 0.6em;">${status.charAt(0).toUpperCase() + status.slice(1)}</span>
            `;
            
            // Update uptime
            if (data.uptime) {
                const minutes = Math.floor(data.uptime / 60);
                const hours = Math.floor(minutes / 60);
                const uptimeText = hours > 0 ? 
                    `${hours}h ${minutes % 60}m` : 
                    `${minutes}m`;
                document.getElementById('uptime').textContent = uptimeText;
            }
        }
        
        // Initial load and periodic updates
        updateStats();
        setInterval(updateStats, 5000);
    </script>
</body>
</html>
